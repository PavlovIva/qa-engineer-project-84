---
- summary: |
Добавление товара в корзину
requirements: |
При нажатии кнопки Add to cart товар должен добавиться в корзину. 
prerequisites: |
Открыта страница https://products-store.hexlet.app/
test-data: |
Товар = Red Nail Polish
steps: |
- Находим в списке товаров Red Nail Polish
- Нажимаем кнопку Add to cart
expected-result: |
Товар добавляется в корзину - над cart появляется кол-во позиций в корзине. 

- summary: |
Проверка возможности смены языка пользователем
requirements: |
При выборе и нажатии кнопки соответствующего языка, сайт должен перейти на этот язык. 
prerequisites: |
Отркыта главная страница https://products-store.hexlet.app/
test-data: |
Доступные языки - английский, русский, испанкий
steps:
- Нажимаем на кнопку languages
- В выпадающем меню выбираем нужный язык
expected-result: |
Язык сайта должен смениться на выбранный

- summary: |
Проверка функции очистки корзины. 
requirements: |
При нажатии на кнопку очистить корзину, все товары должны быть удалены.
prerequisites: |
Должна быьь открыта корзина https://products-store.hexlet.app/cart
Корзина должна содержать 3 товара
test-data: |
Товары - Egss, Fish Steak, Honey Jar
steps: |
Нажать на кнопку Очистить корзину
expected-result: |
Корзина очищается и остается пустой. 

